name: Deploy ToolForgeHQ

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type check
        run: npx tsc --noEmit
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      
      - name: Deploy to production
        run: |
          echo "Frontend build complete!"
          echo "Build artifacts are in the dist/ directory"
          # The actual deployment will be handled by the hosting platform
          # For Vercel/Netlify, they auto-deploy on push to main
          # For manual deployment, the dist/ folder contains the built files
      
      - name: Sync templates to backend
        run: |
          # Copy templates.json to backend if needed
          echo "Templates JSON updated - backend will pick up changes on next deploy"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    
    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "Deployment successful! New templates are now live."
          else
            echo "Deployment failed. Check the logs for details."
            exit 1
          fi
