<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Social Media Templates & AI Content Calendar | ToolForgeHQ</title>
    <meta name="description" content="105+ ready-to-use social media templates with AI prompts. Instagram posts, TikTok scripts, content calendars, and more. Instant download, works with ChatGPT & Claude." />
    <meta name="keywords" content="social media templates, content calendar, instagram templates, tiktok scripts, AI prompts, content creation, social media marketing, business templates" />
    <link rel="canonical" href="https://toolforgehq.com" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolForgeHQ" />
    <meta property="og:title" content="Social Media Templates & AI Content Calendar | ToolForgeHQ" />
    <meta property="og:description" content="105+ ready-to-use social media templates with AI prompts. Instagram posts, TikTok scripts, content calendars. Instant download." />
    <meta property="og:image" content="https://toolforgehq.com/logo/logo-512.png" />
    <meta property="og:url" content="https://toolforgehq.com" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Social Media Templates & AI Content Calendar | ToolForgeHQ" />
    <meta name="twitter:description" content="105+ ready-to-use social media templates with AI prompts. Instagram posts, TikTok scripts, content calendars. Instant download." />
    <meta name="twitter:image" content="https://toolforgehq.com/logo/logo-512.png" />
    
    <!-- Schema.org structured data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ToolForgeHQ",
      "url": "https://toolforgehq.com",
      "logo": "https://toolforgehq.com/logo/logo-512.png",
      "description": "AI-powered templates for social media, business, and content creation",
      "sameAs": []
    }
    </script>
    
    <!-- Schema.org structured data for WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ToolForgeHQ",
      "url": "https://toolforgehq.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://toolforgehq.com/templates?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
